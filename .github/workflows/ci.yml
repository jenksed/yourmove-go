name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-go-ci-workspace
      - run: go build ./...

  desktop:
    name: macOS desktop verification
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -tags desktop ./...
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-go-ci-workspace
      - run: go build -tags desktop,production .
