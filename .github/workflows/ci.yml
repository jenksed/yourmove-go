
name: CI

on:
  pull_request:
    branches:
      - main
      - v0.2/develop
  push:
    branches:
      - main
      - v0.2/develop

permissions:
  contents: read

jobs:
  go:
    name: Go source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate private Go modules
        run: |
          if [ -z "${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}" ]; then
            echo "CAREER_DISCOVERY_READ_TOKEN secret is not set; cannot fetch private Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/jenksed/*" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Build Opportunities frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm list react react-dom

      - name: Run Go tests
        run: go test -count=1 ./...
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-go-ci-workspace

      - name: Build Go application
        run: go build ./...

      - name: Cross-compile Windows desktop executable
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags desktop \
            -o "$RUNNER_TEMP/yourmove-windows-cross/YourMove.exe" .

  desktop:
    name: macOS desktop verification
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate private Go modules
        run: |
          if [ -z "${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}" ]; then
            echo "CAREER_DISCOVERY_READ_TOKEN secret is not set; cannot fetch private Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/jenksed/*" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Build Opportunities frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm list react react-dom

      - name: Run desktop tests
        run: go test -count=1 -tags desktop ./...
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-go-ci-workspace

      - name: Build desktop executable
        run: |
          go build -tags desktop,production \
            -o "$RUNNER_TEMP/yourmove-desktop" .

      - name: Build macOS application bundle
        run: |
          bash release/macos/build.sh \
            "$RUNNER_TEMP/yourmove-macos-candidate"

      - name: Verify macOS application bundle
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/yourmove-macos-candidate"
          app="$candidate/YourMove.app"

          echo "Checking bundle structure..."
          test -d "$app"
          test -s "$app/Contents/MacOS/YourMove"
          test -s "$app/Contents/Resources/YourMove.icns"

          echo "Checking Info.plist..."
          /usr/bin/plutil -lint "$app/Contents/Info.plist"

          icon=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIconFile" \
            "$app/Contents/Info.plist")
          test "$icon" = "YourMove.icns"

          bundle_id=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$app/Contents/Info.plist")
          test "$bundle_id" = "com.yourmove.go"

          echo "Checking architecture..."
          /usr/bin/file "$app/Contents/MacOS/YourMove" \
            | grep -q arm64

          echo "Checking code signature..."
          /usr/bin/codesign --verify --strict "$app"

          echo "Checking source and artifact integrity..."
          cmp \
            "$candidate/source-manifest.json" \
            "$candidate/source-manifest-after.json"

          (
            cd "$candidate"
            shasum -a 256 -c SHA256SUMS.local
          )

          echo "macOS application bundle verification passed"

  windows:
    name: Windows desktop and NSIS package verification
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate private Go modules
        run: |
          if [ -z "${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}" ]; then
            echo "CAREER_DISCOVERY_READ_TOKEN secret is not set; cannot fetch private Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/jenksed/*" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Build Opportunities frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm list react react-dom

      # Build/package verification only. This does not prove WebView2 rendering,
      # installation, dialogs, or persistence; those need Windows 11 acceptance.
      # The Go test suite is intentionally not run here: it has never been
      # exercised on Windows and contains Unix-assuming cases, so gating on
      # it unobserved would trade a known gap for unknown red CI.
      - name: Build Go application
        run: go build ./...

      - name: Vet Windows desktop entry point
        run: go vet -tags desktop .

      - name: Set up Wails and NSIS packaging tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails CLI installation failed' }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --version=3.13 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build unsigned Windows x64 installer candidate
        shell: pwsh
        run: |
          python release/windows/prepare.py (Join-Path $env:RUNNER_TEMP 'yourmove-windows-candidate')
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Verify Windows metadata and unsigned status
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'yourmove-windows-candidate'
          $metadata = Get-Content (Join-Path $candidate 'candidate.json') | ConvertFrom-Json
          $exe = Join-Path $candidate 'YourMove.exe'
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne 'YourMove' -or $version.ProductVersion -ne $metadata.version) { throw 'Wrong application metadata' }
          if ($version.FileVersion -ne "$($metadata.version).$($metadata.build)") { throw 'Wrong build version' }
          foreach ($name in @('YourMove.exe', $metadata.installer)) {
            $file = Join-Path $candidate $name
            if ((Get-AuthenticodeSignature $file).Status -ne 'NotSigned') { throw "Expected explicitly unsigned candidate: $name" }
          }
          if ((Get-FileHash (Join-Path $candidate $metadata.installer) -Algorithm SHA256).Hash -ne $metadata.installer_sha256) { throw 'Installer hash mismatch' }
          Get-Content (Join-Path $candidate 'build-info.txt')
          Get-Content (Join-Path $candidate 'SHA256SUMS')

      # Private CI artifacts only; no GitHub Release is created or uploaded.
      - name: Retain local qualification package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: YourMove-windows-x64-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yourmove-windows-candidate/YourMove-*-windows-x64-unsigned.exe
            ${{ runner.temp }}/yourmove-windows-candidate/YourMove.exe
            ${{ runner.temp }}/yourmove-windows-candidate/YourMove-*-source.zip
            ${{ runner.temp }}/yourmove-windows-candidate/assets/windows/nsis/MicrosoftEdgeWebview2Setup.exe
            ${{ runner.temp }}/yourmove-windows-candidate/*.json
            ${{ runner.temp }}/yourmove-windows-candidate/*.txt
            ${{ runner.temp }}/yourmove-windows-candidate/*.log
            ${{ runner.temp }}/yourmove-windows-candidate/SHA256SUMS
            ${{ runner.temp }}/yourmove-windows-candidate/winget-unpublished/
          if-no-files-found: error
          retention-days: 14

