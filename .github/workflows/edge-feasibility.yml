
# Edge feasibility qualification (experiment only).
#
# Exercises the existing Chromium CDP session against the Windows runner's
# system Microsoft Edge installation. No Zebkit, no installer change, no
# production integration. Triggered only on the Edge feasibility experiment
# branch (plus manual dispatch) so the main CI contract is untouched.
name: Edge feasibility qualification

on:
  push:
    branches:
      - experiment/v0.3-edge-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    name: Edge CDP feasibility (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate private Go modules
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}")) {
            Write-Error "CAREER_DISCOVERY_READ_TOKEN secret is not set; cannot fetch private Go modules."
            exit 1
          }
          git config --global url."https://x-access-token:${{ secrets.CAREER_DISCOVERY_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          "GOPRIVATE=github.com/jenksed/*" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Record runner and Edge version
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName, OsVersion, OsArchitecture | Format-List
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:LOCALAPPDATA 'Microsoft\Edge\Application\msedge.exe')
          )
          if (Get-Command msedge -ErrorAction SilentlyContinue) { $candidates = @((Get-Command msedge).Source) + $candidates }
          $candidates | ForEach-Object { "$_ : $(Test-Path $_)" }
          $edge = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'System Edge not found in any well-known location' }
          "EDGE_EXE=$edge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Get-Item $edge).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          & $edge --version

      - name: Run Edge feasibility unit checks
        shell: pwsh
        run: go test -count=1 ./internal/application/browser/... 2>&1
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-edge-workspace

      - name: Qualify guarded workflow through Edge
        shell: pwsh
        run: go test -count=1 -timeout=10m -tags qualification ./internal/application/browser/chromium -run '^TestEdgeFeasibilityWorkflow$' -v 2>&1
        env:
          YOURMOVE_DATA_DIR: ${{ runner.temp }}/yourmove-edge-workspace
          YOURMOVE_QUALIFY_BROWSER: "1"
